<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CampusGPT — AI-powered cited Q&A over your college documents with hybrid retrieval, reranking, and streaming answers.">
  <title>CampusGPT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="28" height="28" rx="8" fill="url(#logo-grad)"/>
            <path d="M8 14.5C8 11 10.5 8 14 8C17.5 8 20 11 20 14.5C20 18 17.5 20.5 14 20.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <circle cx="14" cy="14.5" r="2" fill="white"/>
            <defs><linearGradient id="logo-grad" x1="0" y1="0" x2="28" y2="28"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs>
          </svg>
          <div>
            <h1>CampusGPT</h1>
            <p class="tagline">Cited answers from your college documents.</p>
          </div>
        </div>
      </div>

      <div class="sidebar-content">
        <section class="sidebar-section">
          <h2>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Documents
          </h2>
          <p class="hint">Tick documents to limit search. None ticked = search all.</p>
          <ul id="doc-list"></ul>
          <label class="upload-label" id="upload-label">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload PDF
            <input type="file" id="file-input" accept="application/pdf">
          </label>
          <p id="upload-status" class="status-text"></p>
        </section>

        <section class="sidebar-section">
          <h2>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            Retrieval Mode
          </h2>
          <div class="mode-selector">
            <label class="mode-option">
              <input type="radio" name="mode" value="hybrid_rerank" checked>
              <span class="mode-chip">
                <span class="mode-dot best"></span>
                Hybrid + Rerank
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="hybrid">
              <span class="mode-chip">
                <span class="mode-dot good"></span>
                Hybrid
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="vector">
              <span class="mode-chip">
                <span class="mode-dot base"></span>
                Vector Only
              </span>
            </label>
          </div>
        </section>
      </div>

      <div class="sidebar-footer">
        <button id="clear-btn" class="btn-secondary btn-full">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear Chat
        </button>
      </div>
    </aside>

    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <main>
      <div id="messages" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#welcome-grad)" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><defs><linearGradient id="welcome-grad" x1="3" y1="3" x2="21" y2="19"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg>
          </div>
          <h2>Welcome to CampusGPT</h2>
          <p>Upload a college document and ask questions. Answers are cited with page numbers.</p>
          <div class="welcome-chips">
            <button class="chip" data-q="What is the minimum attendance required?">📋 Attendance policy</button>
            <button class="chip" data-q="What are the hostel rules?">🏠 Hostel rules</button>
            <button class="chip" data-q="How do I apply for a fee refund?">💰 Fee refund process</button>
          </div>
        </div>
      </div>
      <form id="chat-form">
        <div class="input-wrapper">
          <textarea id="question" rows="1" maxlength="1000"
                    placeholder="Ask a question… Enter to send, Shift+Enter for new line"></textarea>
          <div class="input-actions">
            <button type="submit" id="send-btn" class="btn-send" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
            <button type="button" id="stop-btn" class="btn-stop" hidden aria-label="Stop">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
            </button>
          </div>
        </div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
